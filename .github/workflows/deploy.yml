name: Build & Deploy to GitHub Pages (master)

on:
  # 手动触发：Actions 页面点 Run workflow
  workflow_dispatch:
  # Halo 发布文章后，在 Halo 后台配置 Webhook 调用本仓库的 actions/dispatch（见 README）
  repository_dispatch:
    types: [halo-publish]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (当前分支)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 同步 Halo 文章
        env:
          HALO_BASE_URL: ${{ secrets.HALO_BASE_URL }}
          HALO_PAT: ${{ secrets.HALO_PAT }}
        run: |
          if [ -z "$HALO_BASE_URL" ] || [ -z "$HALO_PAT" ]; then
            echo "⚠️ 未配置 HALO_BASE_URL / HALO_PAT，跳过同步（使用仓库内已有 _posts）"
          else
            node scripts/sync-halo.js
          fi

      - name: 构建 Hexo
        run: |
          node run-hexo.js clean
          node run-hexo.js generate
        env:
          NODE_ENV: production

      - name: 部署到 master（GitHub Pages，保留旧文章与历史文件）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 保存本次构建产物
          cp -r public /tmp/public
          # 切到 master 分支（保留已有文件，rsync 增量更新）
          git fetch origin master || true
          if git rev-parse --verify origin/master >/dev/null 2>&1; then
            git checkout -B master origin/master
          else
            # 首次部署：master 尚不存在，创建独立分支
            git checkout --orphan master
            git rm -rf --cached . 2>/dev/null || true
            git clean -fdx -e node_modules -e public 2>/dev/null || true
          fi
          # 增量同步构建产物：删除产物中不存在的 hexo 管理文件，但保留旧文章/历史文件
          rsync -a --delete --exclude='2023/' --exclude='index1.html' --exclude='.git/' /tmp/public/ ./
          # 强制使用构建产物里的 index.html（博客首页）
          cp -f /tmp/public/index.html index.html
          touch .nojekyll
          git add -A
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
            commit -m "Deploy from source branch: $(git rev-parse --short HEAD)" --allow-empty
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git master

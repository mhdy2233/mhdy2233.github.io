name: Build & Deploy to GitHub Pages (master)

on:
  # 手动触发：Actions 页面点 Run workflow
  workflow_dispatch:
  # 定时轮询 Halo（每 30 分钟；避开整点，整点是 Actions 高峰、排队更久）
  schedule:
    - cron: '17,47 * * * *'
  # 需要「发布即上线」时，可让外部服务调用本仓库的 dispatches 接口触发（见 README）
  repository_dispatch:
    types: [halo-publish]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (当前分支)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 同步 Halo 文章
        env:
          HALO_BASE_URL: ${{ secrets.HALO_BASE_URL }}
          HALO_PAT: ${{ secrets.HALO_PAT }}
        run: |
          if [ -z "$HALO_BASE_URL" ] || [ -z "$HALO_PAT" ]; then
            echo "⚠️ 未配置 HALO_BASE_URL / HALO_PAT，跳过同步（使用仓库内已有 _posts）"
          else
            node tools/sync-halo.js
          fi

      - name: 构建 Hexo
        run: |
          node run-hexo.js clean
          node run-hexo.js generate
        env:
          NODE_ENV: production

      - name: 部署到 master（GitHub Pages）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 保存本次构建产物与当前源码 commit（切分支后 HEAD 会变）
          cp -r public /tmp/public
          SRC_SHA=$(git rev-parse --short HEAD)
          # 同步生成的 source/_posts 未纳入版本管理，切分支前一并清掉，避免残留
          git checkout -- . 2>/dev/null || true
          git clean -fdx source/_posts 2>/dev/null || true
          # 切到 master 分支
          git fetch origin master || true
          if git rev-parse --verify origin/master >/dev/null 2>&1; then
            git checkout -f -B master origin/master
          else
            # 首次部署：master 尚不存在，创建独立分支
            git checkout --orphan master
            git rm -rf --cached . 2>/dev/null || true
            git clean -fdx -e node_modules -e public 2>/dev/null || true
          fi
          # 增量同步构建产物：删除产物中不存在的 hexo 管理文件
          rsync -a --delete --exclude='.git/' /tmp/public/ ./
          # 清理旧博客残留（2023/ 老文章、index1.html 旧首页），只保留 Halo 同步的内容
          rm -rf 2023 index1.html
          # 强制使用构建产物里的 index.html（博客首页）
          cp -f /tmp/public/index.html index.html
          touch .nojekyll
          git add -A
          # 定时轮询大多数时候没有新内容，产物一致就不要留空提交
          if git rev-parse --verify HEAD >/dev/null 2>&1 && git diff --cached --quiet; then
            echo "站点产物无变化，跳过提交与推送"
            exit 0
          fi
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
            commit -m "Deploy from source branch: ${SRC_SHA}"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git master
